server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${DB_USER:payment_user}
    password: ${DB_PASSWORD:payment_user}
  flyway:
    schemas: payments
    default-schema: payments
    locations: classpath:db/migration/payments
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      concurrency: 3
      observation-enabled: true
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 30s
  # Spans are created at this rate; they are exported only when
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (infra/docker-compose.observability.yml).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
ledgerflow:
  auth:
    users:
      - username: alice
        password: ${ALICE_PASSWORD:alice-local}
        accounts: ${ALICE_ACCOUNTS:2}
      - username: bob
        password: ${BOB_PASSWORD:bob-local}
        accounts: ${BOB_ACCOUNTS:4}
  risk:
    velocity-max: ${RISK_VELOCITY_MAX:5}
    blocked-accounts: ${RISK_BLOCKED_ACCOUNTS:}
