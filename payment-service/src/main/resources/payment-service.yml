server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: payment-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://payment_user:payment_user@localhost:27017/payments?replicaSet=rs0&authSource=payments&directConnection=true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
ledgerflow:
  auth:
    users:
      - username: alice
        password: ${ALICE_PASSWORD:alice-local}
        accounts: ${ALICE_ACCOUNTS:2}
      - username: bob
        password: ${BOB_PASSWORD:bob-local}
        accounts: ${BOB_ACCOUNTS:4}
  risk:
    velocity-max: ${RISK_VELOCITY_MAX:5}
    blocked-accounts: ${RISK_BLOCKED_ACCOUNTS:}
