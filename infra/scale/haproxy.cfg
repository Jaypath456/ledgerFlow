# HAProxy for the opt-in scaled topology (infra/docker-compose.scale.yml, ADR 0006). One lightweight proxy in front of the replicas, so the
# replicas publish no host ports: payment API on 8081 (2 replicas), ledger actuator on 8082 (3 replicas). Docker's DNS is re-resolved every
# 2 s, and a failed health check (1 s interval, 2 failures) takes a killed replica out of rotation until it is back.
global
    log stdout format raw local0 notice

defaults
    mode http
    log global
    option dontlognull
    option redispatch
    retries 2
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    timeout check 2s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold other 2s
    hold nx 2s

frontend payment_api
    bind *:8081
    default_backend payment_api

backend payment_api
    balance roundrobin
    option httpchk GET /actuator/health
    default-server check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server payment-service   payment-service:8081
    server payment-service-b payment-service-b:8081

frontend ledger_actuator
    bind *:8082
    default_backend ledger_actuator

backend ledger_actuator
    balance roundrobin
    option httpchk GET /actuator/health
    default-server check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server ledger-service   ledger-service:8082
    server ledger-service-b ledger-service-b:8082
    server ledger-service-c ledger-service-c:8082
