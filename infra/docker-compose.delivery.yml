# Only for new, isolated delivery projects (scripts/demo.py). Every published port moves to its own loopback port,
# so the project can run next to the default stack. Images, memory limits and heap settings come unchanged from
# infra/docker-compose.yml.
services:
  postgres:
    ports: !override ["127.0.0.1:${POSTGRES_PORT:-35432}:5432"]
  kafka:
    ports: !override ["127.0.0.1:${KAFKA_PORT:-39092}:29092"]
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-39092}
  payment-service:
    ports: !override ["127.0.0.1:${PAYMENT_PORT:-18081}:8081"]
  ledger-service:
    ports: !override ["127.0.0.1:${LEDGER_PORT:-18082}:8082"]
