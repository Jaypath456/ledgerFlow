name: ledgerflow
services:
  postgres:
    image: postgres:17.11
    mem_limit: 1g
    shm_size: 256mb # parallel queries (invariant checker) need more than Docker's 64 MB default
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    mem_limit: 1g
    ports: ["127.0.0.1:29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  payment-service:
    build: { context: .., target: payment-service }
    mem_limit: 1g
    ports: ["127.0.0.1:${PAYMENT_PORT:-8081}:8081"]
    environment: &app-env
      DB_URL: jdbc:postgresql://postgres:5432/ledgerflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      RISK_VELOCITY_MAX: ${RISK_VELOCITY_MAX:-5}
      ALICE_PASSWORD: ${ALICE_PASSWORD:-alice-local}
      ALICE_ACCOUNTS: ${ALICE_ACCOUNTS:-2}
      BOB_PASSWORD: ${BOB_PASSWORD:-bob-local}
      BOB_ACCOUNTS: ${BOB_ACCOUNTS:-4}
      LEDGERFLOW_OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-10}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0} # spans are exported only with the observability overlay
      # Fault injection: only with SPRING_PROFILES_ACTIVE=chaos (see docs/DECISIONS.md).
      SPRING_PROFILES_ACTIVE: ${PAYMENT_PROFILES:-default}
      LEDGERFLOW_CHAOS_FAULTS: ${PAYMENT_CHAOS_FAULTS:-}
      LEDGERFLOW_CHAOS_PROBABILITY: ${PAYMENT_CHAOS_PROBABILITY:-0}
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      # The JRE image has no curl/wget; plain HTTP over bash /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  ledger-service:
    build: { context: .., target: ledger-service }
    mem_limit: 1g
    ports: ["127.0.0.1:${LEDGER_PORT:-8082}:8082"]
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: ${LEDGER_PROFILES:-default}
      LEDGERFLOW_CHAOS_FAULTS: ${LEDGER_CHAOS_FAULTS:-}
      LEDGERFLOW_CHAOS_PROBABILITY: ${LEDGER_CHAOS_PROBABILITY:-0}
    depends_on: *app-deps
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  # Opt-in observability (Roadmap Phase 2, ADR 0004). Not started without --profile observability. Use with the app overlay:
  #   docker compose -f infra/docker-compose.yml -f infra/docker-compose.observability.yml --profile observability up -d --build
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    mem_limit: 512m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=2d"]
    environment:
      GOMEMLIMIT: 450MiB
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana-oss:12.4.3
    profiles: [observability]
    mem_limit: 384m
    environment:
      GOMEMLIMIT: 340MiB
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ledgerflow-overview.json
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [observability]
    mem_limit: 512m
    command: ["--config=file:/etc/jaeger/config.yaml"]
    environment:
      GOMEMLIMIT: 450MiB
    # UI only; OTLP/HTTP 4318 stays on the Compose network.
    ports: ["127.0.0.1:16686:16686"]
    volumes:
      - ./observability/jaeger.yaml:/etc/jaeger/config.yaml:ro

volumes:
  pgdata:
  promdata:
