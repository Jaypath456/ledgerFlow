# Local development settings shared by both services; database passwords are in secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledgerflow-config
  namespace: ledgerflow
data:
  DB_URL: jdbc:postgresql://postgres:5432/ledgerflow
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_PROFILES_ACTIVE: k8s
  LEDGERFLOW_OUTBOX_POLL_MS: "10"
  RISK_VELOCITY_MAX: "1000000"
  RISK_BLOCKED_ACCOUNTS: "999999"
  # Heap as a share of the container memory limit, as in infra/docker-compose.yml.
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
