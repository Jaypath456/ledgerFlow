# Dev-only credentials, identical to the Compose stack. The app passwords must match
# infra/postgres/init/01-roles-schemas.sql (loaded into the postgres-init ConfigMap by k8s/start.sh).
apiVersion: v1
kind: Secret
metadata:
  name: ledgerflow-secrets
  namespace: ledgerflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
  PAYMENT_DB_PASSWORD: payment_user
  LEDGER_DB_PASSWORD: ledger_user
