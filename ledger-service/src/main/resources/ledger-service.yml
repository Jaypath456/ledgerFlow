server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: ledger-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://ledger_user:ledger_user@localhost:27017/ledger?replicaSet=rs0&authSource=ledger&directConnection=true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
