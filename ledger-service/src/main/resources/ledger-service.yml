server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${DB_USER:ledger_user}
    password: ${DB_PASSWORD:ledger_user}
  flyway:
    schemas: ledger
    default-schema: ledger
    locations: classpath:db/migration/ledger
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      concurrency: ${LISTENER_CONCURRENCY:3} # consumer threads per instance; at most the partition count is useful (ADR 0005)
      observation-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 30s
  # Spans are created at this rate; they are exported only when
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (infra/docker-compose.observability.yml).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
ledgerflow:
  topics:
    partitions: ${TOPIC_PARTITIONS:3} # partitions of each topic and its dead-letter topic (ADR 0005)
