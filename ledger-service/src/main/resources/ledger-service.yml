server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${DB_USER:ledger_user}
    password: ${DB_PASSWORD:ledger_user}
  flyway:
    schemas: ledger
    default-schema: ledger
    locations: classpath:db/migration/ledger
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
